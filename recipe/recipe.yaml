schema_version: 1

context:
  name: google-re2
  version: "1.1.20251105"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 1db14a292ee8303b91e91e7c37e05ac17d3c467f29416c79ac70a78be3e65bda

build:
  number: 1
  script:
    - if: win
      #then: set "CXXFLAGS=%CXXFLAGS% /std:c++17" && ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
      then: |
        cl /EHsc check.cpp 
        check.exe
    - if: unix
      then: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: build_platform != target_platform
      then: pybind11
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pybind11
    - pip
    - re2
    - setuptools
  run:
    - python
  run_constraints:
    - pyre2 ==9999999999

tests:
  - python:
      imports:
        - re2
  - requirements:
      run:
        - pip
    script:
      - pip check

about:
  summary: RE2 Python bindings
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/google/re2/tree/main/python
  repository: https://github.com/google/re2

extra:
  recipe-maintainers:
    - xylar
